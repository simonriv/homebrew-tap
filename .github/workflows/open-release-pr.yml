# Opens the pull request for a cask branch pushed by Smalti's release pipeline (deploy key), after a style check.
name: open-release-pr

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    # Casks are macOS software; the repository is public, so the macOS runner costs nothing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cask style and audit
        run: |
          brew style Casks/smalti.rb
          # Homebrew 7 audits a third-party tap only once trusted.
          brew tap simonriv/tap "$GITHUB_WORKSPACE"
          brew trust simonriv/tap
          brew audit --cask --strict simonriv/tap/smalti

      - name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version="${BRANCH#release/v}"
          # Only an open PR counts: a closed one for the same branch must not stop a new one.
          [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = 0 ] || exit 0
          gh pr create --base main --head "$BRANCH" --title "smalti $version" \
            --body "Cask de Smalti $version, publicado por el pipeline de release de simonriv/smalti."
